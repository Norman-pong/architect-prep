services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      DB_PATH: "/data/architect.db"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
    ports:
      - "8080:8080"
    volumes:
      - dbdata:/data

volumes:
  dbdata:
