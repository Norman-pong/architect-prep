# Architect Prep — 一键部署
# 用法: docker compose up -d
# 浏览器: http://localhost:8080  验证码邮箱: http://localhost:8025
#
# 生产部署: 复制 .env.example 为 .env，填入真实 SMTP 凭据和 JWT_SECRET

services:
  app:
    image: ghcr.io/${GHCR_OWNER:-Norman-pong}/architect-prep:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      DB_PATH: "/data/architect.db"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production-32chars-min}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-dev@local}"
      SMTP_PASS: "${SMTP_PASS:-dev}"
      SMTP_FROM: "${SMTP_FROM:-Architect Prep <dev@local>}"
    ports:
      - "8080:8080"
    volumes:
      - dbdata:/data
    depends_on:
      - mailpit

  # 本地开发 / 自部署默认邮件捕获器
  # 生产环境: 在 .env 里设 SMTP_HOST 为真实 SMTP 服务器，然后 docker compose up -d --scale mailpit=0
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"  # Web UI
      # SMTP 端口 1025 不暴露给宿主机，app 通过 Docker 内网访问

volumes:
  dbdata:
